<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./js/main.js" defer></script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="calculator">
        <div class="displayBox">
            <input type="text">
        </div>
        <div class="buttonsSection">
            <div class="red">C</div>
            <div class="red">Del</div>
            <div>%</div>
            <div class="blue">/</div>
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div class="blue">*</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div class="blue">-</div>
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div class="blue">+</div>
            <div>( )</div>
            <div>0</div>
            <div>.</div>
            <div class="equal">=</div>
        </div>
    </div>
</body>
</html>
